allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
  # void bundles its own better-sqlite3 binaries; skip the native build
  # (pnpm will still list it under "Ignored build scripts" as informational output)
  better-sqlite3: false
overrides:
  wrangler: ^4.118.0
  ws: ^8.21.1
  sharp: ^0.35.3
  brace-expansion: ^5.0.8
  undici: ^7.29.0
  nanoid: ">=3.3.18"
  postcss: ">=8.5.23"
  # GHSA-g7r4-m6w7-qqqr: esbuild dev server arbitrary file read (Windows)
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  # GHSA-73wf-gq98-2v4g: browserslist prototype write via untrusted browserslist-stats.json
  "browserslist@<=4.28.6": ">=4.28.7"
