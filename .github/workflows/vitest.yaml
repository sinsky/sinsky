name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Build, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Generate worker types
        run: pnpm --filter sinsky-worker types

      - name: Worker typecheck
        run: pnpm --filter sinsky-worker typecheck

      - name: Worker test
        run: pnpm --filter sinsky-worker test
